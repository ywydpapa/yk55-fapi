<!DOCTYPE html>
<html lang="en">
<head>
    {% include '/common/commHeader.html' %}
</head>
<body id="page-top">
<!-- Page Wrapper -->
<div id="wrapper">
    {% include '/common/sidebar.html' %}
    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            {% include '/common/topbar.html' %}
            <!-- Begin Page Content -->
            <div class="container-fluid">
                <!-- Page Heading -->
                <h1 class="h3 mb-4 text-gray-800">카테고리 수정</h1>
                <div class="d-flex justify-content-center" style="min-height: 100vh;">
                    <div class="col-md-9">
                        <table class="table table-bordered text-center">
                            <thead>
                            </thead>
                            <tbody>
                            <form method="POST" id="editor-form" action="/cat_update/{{ catdtl[0] }}">
                                <tr>
                                    <td> 카테고리명 </td>
                                    <td><input class="form-control" id="rtitle" name="rtitle" type="text" required value="{{catdtl[1]}}"></td>
                                </tr>
                                <tr>
                                    <td> 카테고리명(영문) </td>
                                    <td><input class="form-control" id="rtitleeng" name="rtitleeng" type="text" value="{{catdtl[2]}}"></td>
                                </tr>
                                <tr>
                                    <td> 카테고리명(한자) </td>
                                    <td><input class="form-control" id="rtitlechn" name="rtitlechn" type="text" value="{{catdtl[3]}}"></td>
                                </tr>
                                <tr>
                                    <td> 카테고리종류 </td>
                                    <td>
                                        <select class="form-control" id="rtype" name="rtype">
                                            <option value="MIDTL" {% if catdtl[4] == 'MIDTL' %}selected {% endif %}>회원상세정보</option>
                                            <option value="ETC" {% if catdtl[4] == 'ETC' %}selected {% endif %}>기타정보</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <div class="col-12"
                                             style="display: flex; justify-content: space-between; gap: 10px;">
                                            <a href="#" onclick="window.location.href='/mst_cat'; return false;"
                                               class="btn btn-dark"
                                               role="button" style="flex: 0 0 30%;">카테고리 목록으로 돌아가기</a>
                                            <button type="submit" class="btn btn-primary" style="flex: 0 0 50%;">항목 저장
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </form>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->
        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; SOFTCORE 2026</span>
                </div>
            </div>
        </footer>
        <!-- End of Footer -->
    </div>
    <!-- End of Content Wrapper -->
</div>
<!-- End of Page Wrapper -->
<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>
<!-- Bootstrap core JavaScript-->
{% include '/common/commonScript.html' %}

</body>
</html>
