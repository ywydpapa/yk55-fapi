<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>축사 인쇄</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
     :root {
    --gold-dark: #10d0f7;
    /* 배경을 옅은 하늘색으로 변경 */
    --paper-bg: #EAF6FF;
  }

    @page { size: A4; margin: 0; }

    body {
      margin: 0; padding: 0;
      background: #555;
      font-family: "Nanum Myeongjo", serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .preview-wrap {
      display: flex;
      justify-content: center;
      padding: 30px 0;
      min-height: 100vh;
    }

    .page {
      width: 210mm;
      height: 297mm;
      background-color: var(--paper-bg);
      position: relative;
      box-sizing: border-box;
      box-shadow: 0 8px 30px rgba(0,0,0,.3);
      overflow: hidden;
    }

    /* --- [헤더 영역] --- */
    .member-photo {
      position: absolute;
      top: 20mm; right: 20mm;
      width: 35mm; height: 45mm;
      object-fit: cover;
      border: 1px solid #ccc;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
      z-index: 50;
      background-color: #f0f0f0;
    }

    .meta {
      position: absolute;
      top: 48mm; right: 60mm;
      text-align: right;
      z-index: 50;
      min-width: 120mm;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
    }
    .meta .position { font-size: 11pt; color: #555; margin-bottom: 5px; }
    .meta .name { font-size: 18pt; font-weight: 800; color: #000; }

    .title {
      position: absolute;
      top: 25mm; left: 0; width: 100%;
      text-align: center;
      font-size: 28pt;
      font-weight: 800;
      letter-spacing: 5px;
      color: #000;
      z-index: 40;
    }
    .title::after {
      content: ''; display: block; width: 40mm; height: 2px;
      background: var(--gold-dark); margin: 15px auto 0; opacity: 0.6;
    }

    /* --- [본문 영역] --- */
    .content-layer {
      position: absolute;
      top: 70mm;
      left: 20mm;
      right: 20mm;
      /* 하단 테두리(20mm)보다 약간 위에서 끝나도록 설정 */
      bottom: 25mm;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    .body {
      font-size: 11.5pt;
      line-height: 1.6;
      text-align: justify;
      word-break: keep-all;
      width: 100%;
    }
    .body p { margin: 0 0 10px 0; }

    /* --- [Footer 영역] --- */
    /* 테두리(bottom: 18mm) 아래쪽 여백에 위치 */
    .footer {
      position: absolute;
      bottom: 8mm; /* 페이지 끝에서 8mm 위 */
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 10pt; /* 하단 문구는 살짝 작게 */
      color: #333;
      font-weight: bold;
      z-index: 60;
    }

    .corner { position: absolute; width: 30mm; height: 30mm; pointer-events: none; fill: none; stroke: var(--gold-dark); stroke-width: 1.2; }

    .top-left { top: 14mm; left: 14mm; }
    .top-right { top: 14mm; right: 14mm; transform: scaleX(-1); }
    .bottom-left { bottom: 20mm; left: 14mm; transform: scaleY(-1); }
    .bottom-right { bottom: 20mm; right: 14mm; transform: scale(-1); }

    @media print {
      body { background: none; }
      .preview-wrap { padding: 0; display: block; }
      .page { margin: 0 auto; box-shadow: none; page-break-after: always; border: none; }
    }
  .zigzag-border{
    position:absolute;
    inset:0;
    z-index: 25;            /* 내용보다 위, 사진/메타와는 취향대로 */
    pointer-events:none;
  }
  .zigzag{
    fill:none;
    stroke: var(--gold-dark);
    stroke-linejoin: miter;
    stroke-linecap: square;
  }
  .zigzag.outer{ stroke-width: 6; opacity: .9; }
  .zigzag.inner{ stroke-width: 3; opacity: .6; }
</style>

</head>

<!-- [자동 맞춤 스크립트] -->
<script>
  window.onload = function() {
    const body = document.getElementById('contentBody');
    const container = document.querySelector('.content-layer');

    // 사용 가능한 높이 (컨테이너 높이 그대로 사용)
    const availableHeight = container.clientHeight;

    let fontSize = 11.5;
    let lineHeight = 1.6;

    function isOverflowing() {
      return body.scrollHeight > availableHeight;
    }
    function isTooEmpty() {
      return body.scrollHeight < (availableHeight * 0.75);
    }

    // A. 내용이 넘칠 때
    if (isOverflowing()) {
      while (isOverflowing() && fontSize > 8) {
        if (lineHeight > 1.35) {
            lineHeight -= 0.05;
        } else {
            fontSize -= 0.2;
            lineHeight = 1.4;
        }
        body.style.fontSize = fontSize + 'pt';
        body.style.lineHeight = lineHeight;
      }
    }
    // B. 내용이 부족할 때
    else if (isTooEmpty()) {
      while (isTooEmpty() && lineHeight < 2.3) {
        lineHeight += 0.05;
        body.style.lineHeight = lineHeight;

        if (lineHeight > 1.8 && fontSize < 13) {
             fontSize += 0.1;
             body.style.fontSize = fontSize + 'pt';
        }
      }
    }
  };
</script>
