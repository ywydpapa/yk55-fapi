<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>축사 인쇄</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-dark: #B8860B;
      --paper-bg: #FFFCF5;
    }

    /* 인쇄 시 기본 설정 */
    @page {
      size: A4;
      margin: 0; /* 브라우저 자체 여백 제거 */
    }

    body {
      margin: 0;
      padding: 0;
      background: #555; /* 미리보기 배경 */
      font-family: "Nanum Myeongjo", serif;
      -webkit-print-color-adjust: exact; /* 배경색/이미지 강제 인쇄 */
      print-color-adjust: exact;
    }

    .preview-wrap {
      display: flex;
      justify-content: center;
      padding: 30px 0;
      min-height: 100vh;
    }

    /* A4 페이지 정의 */
    .page {
      width: 210mm;
      height: 297mm; /* min-height 대신 고정 height 사용 */
      background-color: var(--paper-bg);
      position: relative;
      box-sizing: border-box;
      box-shadow: 0 8px 30px rgba(0,0,0,.3);
      padding: 20mm; /* 여백을 조금 줄여 본문 공간 확보 (25mm -> 20mm) */
      overflow: hidden; /* A4 밖으로 나가는 내용 숨김 */
    }

    /* --- [레이아웃: 상단 헤더 영역] --- */

    /* 1. 사진 (우측 상단) */
    .member-photo {
      position: absolute;
      top: 20mm;       /* 페이지 패딩과 맞춤 */
      right: 20mm;
      width: 35mm;
      height: 45mm;
      object-fit: cover;
      border: 1px solid #ccc;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
      z-index: 50;
      background-color: #f0f0f0;
    }

    /* 2. 직함/이름 (사진 좌측) */
    .meta {
      position: absolute;
      top: 48mm; /* 사진 하단 라인에 맞춰 정렬 */
      right: 60mm; /* 사진 너비(35) + 간격(5) + 우측여백(20) */
      text-align: right;
      z-index: 50;
      min-width: 120mm;
    }

    .meta .position {
      display: inline-block;
      font-size: 11pt;
      color: #555;
      margin-right: 5px;
    }

    .meta .name {
      font-size: 16pt;
      font-weight: 800;
      color: #000;
    }

    /* 3. 제목 (중앙) */
    .title {
      position: absolute;
      top: 25mm;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 28pt; /* 제목 크기 조정 */
      font-weight: 800;
      letter-spacing: 5px;
      color: #000;
      z-index: 40;
      /* 사진과 겹치지 않도록 우측 여백 확보 */
      padding-right: 60mm;
      box-sizing: border-box;
    }

    /* 제목 장식선 */
    .title::after {
      content: '';
      display: block;
      width: 40mm;
      height: 2px;
      background: var(--gold-dark);
      margin: 10px auto 0; /* 중앙 정렬 */
      /* padding-right 때문에 중앙이 틀어질 수 있으므로 transform 보정 */
      transform: translateX(30mm);
      opacity: 0.6;
    }

    /* --- [디자인 요소: 테두리] --- */
    .border-outer {
      position: absolute;
      top: 8mm; left: 8mm; right: 8mm; bottom: 8mm;
      border: 2px solid var(--gold-dark);
      pointer-events: none;
    }
    .border-inner {
      position: absolute;
      top: 10mm; left: 10mm; right: 10mm; bottom: 10mm;
      border: 1px solid var(--gold-dark);
      pointer-events: none;
    }

    /* 코너 장식 */
    .corner {
      position: absolute;
      width: 30mm; height: 30mm;
      pointer-events: none;
      fill: none; stroke: var(--gold-dark); stroke-width: 1.2;
    }
    .top-left { top: 10mm; left: 10mm; }
    .top-right { top: 10mm; right: 10mm; transform: scaleX(-1); }
    .bottom-left { bottom: 10mm; left: 10mm; transform: scaleY(-1); }
    .bottom-right { bottom: 10mm; right: 10mm; transform: scale(-1); }

    /* --- [본문 영역] --- */
    .content-layer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
      /* 상단 여백: 사진 높이(45mm) + 여백(약 15mm) */
      padding-top: 60mm;
    }

    .body {
      font-size: 11pt;
      /* 줄간격 1.6으로 변경하여 가독성 확보 (기존 1.1은 너무 좁음) */
      line-height: 1.6;
      text-align: justify; /* 양쪽 정렬 */
      word-break: keep-all; /* 단어 단위 줄바꿈 */
      flex: 1; /* 남은 공간 모두 차지 */
      overflow: hidden; /* 넘치는 텍스트 숨김 (필요시 auto로 변경) */
    }

    .footer {
      height: 20mm;
      display: flex;
      align-items: end;
      justify-content: center;
      font-size: 11pt;
      color: #333;
      font-weight: bold;
      padding-bottom: 5mm;
    }

    /* 인쇄 전용 스타일 */
    @media print {
      body { background: none; }
      .preview-wrap { padding: 0; display: block; }
      .page {
        margin: 0 auto;
        box-shadow: none;
        page-break-after: always;
        border: none;
      }
    }
  </style>
</head>
<body>

<div class="preview-wrap">
  <div class="page">

    <!-- 디자인 테두리 -->
    <div class="border-outer"></div>
    <div class="border-inner"></div>

    <svg class="corner top-left" viewBox="0 0 100 100"><path d="M 5 95 L 5 30 Q 5 5 30 5 L 95 5" /><path d="M 15 95 L 15 35 Q 15 15 35 15 L 95 15" stroke-width="0.5" /><path d="M 5 30 L 0 30 M 30 5 L 30 0" stroke="none" fill="#B8860B" /></svg>
    <svg class="corner top-right" viewBox="0 0 100 100"><path d="M 5 95 L 5 30 Q 5 5 30 5 L 95 5" /><path d="M 15 95 L 15 35 Q 15 15 35 15 L 95 15" stroke-width="0.5" /></svg>
    <svg class="corner bottom-left" viewBox="0 0 100 100"><path d="M 5 95 L 5 30 Q 5 5 30 5 L 95 5" /><path d="M 15 95 L 15 35 Q 15 15 35 15 L 95 15" stroke-width="0.5" /></svg>
    <svg class="corner bottom-right" viewBox="0 0 100 100"><path d="M 5 95 L 5 30 Q 5 5 30 5 L 95 5" /><path d="M 15 95 L 15 35 Q 15 15 35 15 L 95 15" stroke-width="0.5" /></svg>

    <!-- 1. 사진 -->
    <img src="/static/img/docs/docphoto_{{docs[0]}}.png" class="member-photo" alt="사진" onerror="this.style.visibility='hidden'">

    <!-- 2. 직함/이름 -->
    <div class="meta">
      <span class="position">{{ docs[2] }}</span>
      <span class="name">{{ docs[3] }}</span>
    </div>

    <!-- 3. 제목 -->
    <div class="title">{{ docs[4] }}</div>

    <!-- 4. 본문 및 하단 -->
    <div class="content-layer">
      <div class="body">
        {{ docs[5] | safe }}
      </div>
      <div class="footer">
        {{ docs[9] }}
      </div>
    </div>

  </div>
</div>

</body>
</html>
