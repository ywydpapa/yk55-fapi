<!DOCTYPE html>
<html lang="en">
<head>
    {% include '/common/commHeader.html' %}
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        #editor-container {
            height: 300px;
        }
    </style>
</head>
<body id="page-top">
<!-- Page Wrapper -->
<div id="wrapper">
    {% include '/common/sidebar.html' %}
    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            {% include '/common/topbar.html' %}
            <!-- Begin Page Content -->
            <div class="container-fluid">
                <!-- Page Heading -->
                <h1 class="h3 mb-4 text-gray-800">새지구 행사 등록</h1>
                <div class="d-flex justify-content-center" style="min-height: 100vh;">
                    <div class="col-md-9">
                        <table class="table table-bordered text-center">
                            <thead>
                            </thead>
                            <tbody>
                            <form method="POST" id="editor-form" action="/devent_insert">
                                <tr>
                                    <td> 행사명 </td>
                                    <td> <input class="form-control" id="ceventtitle" name="ceventtitle" type="text" required ></td>
                                </tr>
                                <tr>
                                    <td> 행사종류 </td>
                                    <td> <select class="form-control" id="eventtype" name="eventtype" >
                                        <option value="CLUBE">클럽행사</option>
                                        <option value="REGIE">지역행사</option>
                                        <option value="DISTE" selected>지구행사</option>
                                        <option value="EDIST">복합지구행사</option>
                                    </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td> 행사시작 </td>
                                    <td> <input class="form-control" id="eventfrom" name="eventfrom" type="datetime-local" required ></td>
                                </tr>
                                <tr>
                                    <td> 행사종료 </td>
                                    <td><input class="form-control" id="eventto" name="eventto" type="datetime-local" required ></td>
                                </tr>
                                <tr>
                                    <td> 적용회기 </td>
                                    <td> <select class="form-control" id="eventperiod" name="eventperiod">
                                        {% for per in periodlist %}
                                        <option value="{{per.periodNo}}" {% if per.periodNo|int == periodno|int %}selected{% endif %}>{{per.periodTitle2}}회기 ({{ per.yearFr }}~{{ per.yearTo }})</option>
                                        {% endfor %}
                                        </select></td>
                                </tr>
                                <tr>
                                    <td> 소요비용 </td>
                                    <td><input style="text-align: right" class="form-control" id="eventcost" name="eventcost" type="number" required value="10000"></td>
                                </tr>
                                <tr>
                                    <td> 배치순서 </td>
                                    <td><input style="text-align: right" class="form-control" id="sortno" name="sortno" type="number" required value="100"></td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <div class="col-12"
                                             style="display: flex; justify-content: space-between; gap: 10px;">
                                            <a href="#" onclick="window.location.href='/dist_eventlist'; return false;"
                                               class="btn btn-dark"
                                               role="button" style="flex: 0 0 30%;">행사 목록으로 돌아가기</a>
                                            <button type="submit" class="btn btn-primary" style="flex: 0 0 50%;">신규행사 저장
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </form>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->
        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; SOFTCORE 2026</span>
                </div>
            </div>
        </footer>
        <!-- End of Footer -->
    </div>
    <!-- End of Content Wrapper -->
</div>
<!-- End of Page Wrapper -->
<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>
<!-- Bootstrap core JavaScript-->
{% include '/common/commonScript.html' %}
<script>
  function pad2(n) { return String(n).padStart(2, '0'); }

  // datetime-local 형식: YYYY-MM-DDTHH:MM
  function toLocalDatetimeValue(date) {
    return [
      date.getFullYear(),
      pad2(date.getMonth() + 1),
      pad2(date.getDate())
    ].join('-') + 'T' + pad2(date.getHours()) + ':' + pad2(date.getMinutes());
  }

  function setTime(date, hh, mm) {
    const d = new Date(date);
    d.setHours(hh, mm, 0, 0);
    return d;
  }

  function parseLocalDatetimeValue(val) {
    // val: "YYYY-MM-DDTHH:MM"
    if (!val) return null;
    const d = new Date(val);
    return isNaN(d.getTime()) ? null : d;
  }

  document.addEventListener('DOMContentLoaded', function () {
    const startEl = document.getElementById('eventfrom');
    const endEl = document.getElementById('eventto');
    if (!startEl || !endEl) return;

    // 기본값 설정 (값이 비어있을 때만)
    const now = new Date();
    if (!startEl.value) startEl.value = toLocalDatetimeValue(setTime(now, 9, 0));
    if (!endEl.value) endEl.value = toLocalDatetimeValue(setTime(now, 18, 0));

    function ensureEndAfterStartPlus4h() {
      const start = parseLocalDatetimeValue(startEl.value);
      const end = parseLocalDatetimeValue(endEl.value);
      if (!start) return;

      // 종료가 없거나, 종료 <= 시작이면 종료를 시작+4시간으로 보정
      if (!end || end.getTime() <= start.getTime()) {
        const newEnd = new Date(start.getTime() + 4 * 60 * 60 * 1000);
        endEl.value = toLocalDatetimeValue(newEnd);
      }
    }

    // 시작시간 변경 시 보정
    startEl.addEventListener('change', ensureEndAfterStartPlus4h);

    // 초기 로드 시에도 한 번 보정
    ensureEndAfterStartPlus4h();
  });
</script>

</body>
</html>
