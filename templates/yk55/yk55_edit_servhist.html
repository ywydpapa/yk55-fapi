<!DOCTYPE html>
<html lang="en">
<head>
    {% include '/common/commHeader.html' %}
</head>
<body id="page-top">
<!-- Page Wrapper -->
<div id="wrapper">
    {% include '/common/sidebar.html' %}
    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            {% include '/common/topbar.html' %}
            <!-- Begin Page Content -->
            <div class="container-fluid">
                <!-- Page Heading & Form Card -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                        <h6 class="m-0 font-weight-bold text-primary">봉사실적 수정 (No. {{ servdtl[0] }})</h6>
                        <a href="/yk55servhist_view/{{ servdtl[1] }}" class="btn btn-sm btn-secondary shadow-sm">
                            <i class="fas fa-arrow-left fa-sm text-white-50 mr-1"></i>목록으로 돌아가기
                        </a>
                    </div>
                    <div class="card-body">
                        <!-- 봉사실적 수정 폼 -->
                        <form id="serveHistForm" action="/update_servhist/{{ servdtl[0] }}" method="POST">
                            <!-- 식별자(PK) hidden -->
                            <input type="hidden" name="serveNo" value="{{ servdtl[0] }}">

                            <!-- 회기 및 봉사종류 -->
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="periodNo" class="font-weight-bold">회기 (대수)</label>
                                    {% if periods %}
                                    <select class="form-control" id="periodNo" name="periodNo" required>
                                        {% for p in periods %}
                                            <option value="{{ p.periodNo if p.periodNo is defined else p[0] }}"
                                                {% if (p.periodNo if p.periodNo is defined else p[0]) == servdtl[1] %}selected{% endif %}>
                                                제 {{ p.periodNo if p.periodNo is defined else p[0] }}기
                                            </option>
                                        {% endfor %}
                                    </select>
                                    {% else %}
                                    <input type="number" class="form-control" id="periodNo" name="periodNo" value="{{ servdtl[1] or '' }}" required>
                                    {% endif %}
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="serveType" class="font-weight-bold">봉사종류</label>
                                    <!-- 봉사종류 셀렉트 박스 -->
                                    <select class="form-control" id="serveType" name="serveType" required>
                                        <option value="DISTM" {% if servdtl[2] == 'DISTM' or not servdtl[2] %}selected{% endif %}>지구행사 (DISTM)</option>
                                        <option value="REGIM" {% if servdtl[2] == 'REGIM' %}selected{% endif %}>지역행사 (REGIM)</option>
                                        <option value="CLUBM" {% if servdtl[2] == 'CLUBM' %}selected{% endif %}>클럽행사 (CLUBM)</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 봉사명 -->
                            <div class="form-group">
                                <label for="serveTitle" class="font-weight-bold">봉사명 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="serveTitle" name="serveTitle" maxlength="1000" value="{{ servdtl[3] or '' }}" placeholder="봉사 사업명을 입력하세요" required>
                            </div>

                            <!-- 봉사 기간 및 봉사비용 -->
                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label for="serveTimefrom" class="font-weight-bold">봉사 시작일</label>
                                    <input type="date" class="form-control" id="serveTimefrom" name="serveTimefrom" value="{{ servdtl[6] or '' }}">
                                </div>
                                <div class="form-group col-md-4">
                                    <label for="serveTimeto" class="font-weight-bold">봉사 종료일</label>
                                    <input type="date" class="form-control" id="serveTimeto" name="serveTimeto" value="{{ servdtl[7] or '' }}">
                                </div>
                                <div class="form-group col-md-4">
                                    <label for="serveCost" class="font-weight-bold">봉사비용 (원)</label>
                                    <input type="number" class="form-control" id="serveCost" name="serveCost" value="{{ servdtl[5] if servdtl[5] is not none else '' }}" placeholder="예: 1500000" min="0">
                                </div>
                            </div>

                            <!-- 봉사내용 -->
                            <div class="form-group">
                                <label for="serveContent" class="font-weight-bold">봉사내용</label>
                                <textarea class="form-control" id="serveContent" name="serveContent" rows="6" maxlength="2000" placeholder="봉사 세부 내용을 입력하세요 (최대 2,000자)">{{ servdtl[4] or '' }}</textarea>
                            </div>

                            <!-- 기본 속성값 -->
                            <input type="hidden" name="attrib" value="{{ servdtl[10] or '1000010000' }}">

                            <!-- 하단 버튼 영역 -->
                            <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                                <div>
                                    <button type="button" class="btn btn-outline-danger px-3" onclick="confirmDelete()">
                                        <i class="fas fa-trash-alt mr-1"></i>삭제
                                    </button>
                                </div>
                                <div>
                                    <a href="/yk55servhist_view/{{ servdtl[1] }}" class="btn btn-secondary px-4 mr-2">취소</a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="fas fa-save mr-1"></i>수정 내용 저장
                                    </button>
                                </div>
                            </div>
                        </form>

                        <!-- 삭제용 숨김 폼 (POST) -->
                        <form id="deleteForm" action="/delete_servhist/{{ servdtl[0] }}" method="POST" style="display: none;">
                            <input type="hidden" name="periodNo" value="{{ servdtl[1] }}">
                        </form>
                    </div>
                </div>
            </div>
            <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->
        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; SOFTCORE 2026</span>
                </div>
            </div>
        </footer>
        <!-- End of Footer -->
    </div>
    <!-- End of Content Wrapper -->
</div>
<!-- End of Page Wrapper -->
<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>
<!-- Bootstrap core JavaScript-->
{% include '/common/commonScript.html' %}

<!-- 유효성 검사 및 삭제 스크립트 -->
<script>
document.getElementById('serveHistForm').addEventListener('submit', function(e) {
    const startDate = document.getElementById('serveTimefrom').value;
    const endDate = document.getElementById('serveTimeto').value;

    if (startDate && endDate && startDate > endDate) {
        alert('봉사 종료일은 시작일보다 이전일 수 없습니다.');
        e.preventDefault();
    }
});

function confirmDelete() {
    if (confirm("정말 이 봉사실적 내역을 삭제하시겠습니까?\n삭제된 데이터는 목록에서 더 이상 표시되지 않습니다.")) {
        document.getElementById('deleteForm').submit();
    }
}
</script>

</body>
</html>
