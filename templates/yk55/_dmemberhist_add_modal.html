{% if session.user_Role == 'ADMIN' %}
<div class="modal fade" id="districtOfficerModal" tabindex="-1" role="dialog" aria-labelledby="districtOfficerModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form id="districtOfficerForm" action="/yk55membhist_insert/{{ periodno }}" method="POST">
                <input type="hidden" name="viewType" value="{{ view_type }}">
                <input type="hidden" name="memberNo" id="districtOfficerMemberNo">
                <div class="modal-header">
                    <h5 class="modal-title" id="districtOfficerModalLabel">{{ periodno }}대 지구임원 회원 등록</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="districtOfficerRankNo">직책</label>
                        <select class="form-control" id="districtOfficerRankNo" name="rankNo" required>
                            <option value="">직책을 선택해 주세요</option>
                            {% for rank in district_officer_ranks %}
                            <option value="{{ rank.rankNo }}">{{ rank.rankTitle }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="districtOfficerSearch">회원 검색</label>
                        <div class="input-group">
                            <input type="search" class="form-control" id="districtOfficerSearch" maxlength="50" placeholder="회원명 또는 클럽명 (2자 이상)">
                            <div class="input-group-append">
                                <button type="button" class="btn btn-outline-primary" id="districtOfficerSearchButton">검색</button>
                            </div>
                        </div>
                    </div>
                    <div id="districtOfficerSearchMessage" class="small text-muted mb-2" role="status"></div>
                    <div id="districtOfficerResults" class="list-group" aria-live="polite"></div>
                    <div class="mt-3 small">선택된 회원: <strong id="districtOfficerSelectedMember">선택되지 않음</strong></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary" id="districtOfficerSubmit" disabled>등록</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    (function () {
        const searchInput = document.getElementById('districtOfficerSearch');
        const searchButton = document.getElementById('districtOfficerSearchButton');
        const results = document.getElementById('districtOfficerResults');
        const message = document.getElementById('districtOfficerSearchMessage');
        const memberNoInput = document.getElementById('districtOfficerMemberNo');
        const selectedMember = document.getElementById('districtOfficerSelectedMember');
        const submitButton = document.getElementById('districtOfficerSubmit');
        let searchTimer;

        async function searchMembers() {
            const query = searchInput.value.trim();
            results.replaceChildren();
            memberNoInput.value = '';
            selectedMember.textContent = '선택되지 않음';
            submitButton.disabled = true;
            if (query.length < 2) {
                message.textContent = '회원명이나 클럽명을 두 글자 이상 입력해 주세요.';
                return;
            }

            message.textContent = '검색 중...';
            try {
                const response = await fetch('/api/yk55/cabinet-members?q=' + encodeURIComponent(query));
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || '회원 검색에 실패했습니다.');
                }
                if (data.members.length === 0) {
                    message.textContent = '검색 결과가 없습니다.';
                    return;
                }
                data.members.forEach(function (member) {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'list-group-item list-group-item-action';
                    button.textContent = member.memberName + ' (' + member.clubName + ')';
                    button.addEventListener('click', function () {
                        memberNoInput.value = member.memberNo;
                        selectedMember.textContent = button.textContent;
                        submitButton.disabled = false;
                        results.querySelectorAll('button').forEach(function (item) {
                            item.classList.remove('active');
                        });
                        button.classList.add('active');
                    });
                    results.appendChild(button);
                });
                message.textContent = '검색 결과 ' + data.members.length + '명 (최대 30명)';
            } catch (error) {
                message.textContent = error.message;
            }
        }

        searchButton.addEventListener('click', searchMembers);
        searchInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                searchMembers();
            }
        });
        searchInput.addEventListener('input', function () {
            window.clearTimeout(searchTimer);
            searchTimer = window.setTimeout(searchMembers, 350);
        });
        $('#districtOfficerModal').on('show.bs.modal', function () {
            document.getElementById('districtOfficerForm').reset();
            memberNoInput.value = '';
            selectedMember.textContent = '선택되지 않음';
            submitButton.disabled = true;
            results.replaceChildren();
            message.textContent = '';
        });
    })();
</script>
{% endif %}
