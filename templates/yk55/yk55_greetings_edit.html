<!DOCTYPE html>
<html lang="kr">
<head>
    {% include '/common/commHeader.html' %}
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        #editor-container {
            height: 300px;
        }
    </style>
    <style>
        #popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        #popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;

            /* 비율 기반 크기 */
            width: 50vw; /* 가로 비율 */
            height: 50vh; /* 세로 비율 */

            background: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 닫기 버튼 영역을 고정 높이로 만들고 iframe 높이를 계산 */
        #popup-header {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 6px 10px;
            border-bottom: 1px solid #eee;
            box-sizing: border-box;
            background: #fff;
        }

        #popup-close {
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
        }

        #popup iframe {
            width: 100%;
            height: calc(100% - 44px);
            border: 0;
            display: block;
        }
    </style>

    <style>
        #imagePreview {
            display: none; /* 기본적으로 숨김 */
            max-width: 200px; /* 최대 너비 설정 */
            max-height: 250px; /* 최대 높이 설정 */
            margin-top: 10px;
        }

        .image-container {
            display: flex; /* 이미지들을 가로로 배치 */
            justify-content: center; /* 가로 정렬 */
            align-items: center; /* 세로 정렬 */
            gap: 20px; /* 이미지 간격 */
        }
    </style>

</head>
<body id="page-top">
<!-- Page Wrapper -->
<div id="wrapper">
    {% include '/common/sidebar.html' %}
    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            {% include '/common/topbar.html' %}
            <!-- Begin Page Content -->
            <div class="container-fluid">
                <!-- Page Heading -->
                <h1 class="h3 mb-4 text-gray-800">문서 수정</h1>
                <div class="d-flex justify-content-center" style="min-height: 100vh;">
                    <div class="col-md-9">
                        <table class="table table-bordered text-center">
                            <thead>
                            </thead>
                            <tbody>
                            <tr>
                                <td style="text-align: center; vertical-align: middle">첨부 사진</td>
                                <td style="text-align: center">
                                    <div class="image-container">
                                        <img src="/static/img/docs/docphoto_{{docs[0]}}.png"
                                             onerror="this.src='/static/img/defaultphoto.png'" alt="Member Image">
                                        <img id="imagePreview" alt="Image Preview" style="display:none; max-width: 100%; max-height: 300px; margin-top: 10px;">
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>사진 변경</td>
                                <td>
                                    <form action="/uploaddocmphoto/{{docs[0]}}" method="post"
                                          enctype="multipart/form-data">
                                        <input type="file" name="file" accept="image/*" required
                                               onchange="displayFileInfo(this)">
                                        <span id="fileSize"></span>
                                        <input type="submit" value="첨부사진 Upload"></form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <form method="POST" id="editor-form" action="/yk55greetupdate/{{docs[0]}}">
                            <table class="table table-bordered text-center">
                                <thead>
                                </thead>
                                <tbody>
                                <tr>
                                    <td> 작성자 (소속/ 직책)</td>
                                    <td><input class="form-control" id="dwriter1" name="dwriter1" type="text" required
                                               value="{{ docs[2] }}"></td>
                                </tr>
                                <tr>
                                    <td> 작성자</td>
                                    <td><input class="form-control" id="dwriter2" name="dwriter2" type="text" required
                                               value="{{ docs[3] }}"></td>
                                </tr>
                                <tr>
                                    <td> 제목</td>
                                    <td><input class="form-control" id="doctitle" name="dtitle" type="text" required
                                               value="{{ docs[4] }}"></td>
                                </tr>
                                <tr>
                                    <td> 내용</td>
                                    <td>
                                        <div id="editor-container" name="dcontent"></div>
                                        <input type="hidden" name="dcontent" id="dcontent">
                                    </td>
                                </tr>
                                <tr>
                                    <td> 등록 행사</td>
                                    <td><select class="form-control" id="docevent" name="docevent">
                                        <option value="0">선택</option>
                                        {% for event in events %}
                                        <option value="{{ event.eventNo }}" {% if docs[1]|int==event.eventNo|int %}selected{% endif %}>{{ event.eventTitle }}</option>
                                        {% endfor %}
                                    </select></td>
                                </tr>
                                <tr>
                                    <td> 등록종류</td>
                                    <td><select class="form-control" id="doctype">
                                        <option value="GREET" {% if docs[6]==
                                        'GREET' %}selected{% endif %}>축사</option>
                                        <option value="CLEBR" {% if docs[6]==
                                        'CLEBR' %}selected{% endif %}>기념사</option>
                                        <option value="MEMOR" {% if docs[6]==
                                        'MEMOR' %}selected{% endif %}>회고사</option>
                                    </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td> 최종 수정일</td>
                                    <td>{{ docs[7] }}</td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <div class="col-12"
                                             style="display: flex; justify-content: space-between; gap: 10px;">
                                            <a href="#" onclick="window.location.href='/yk55greet'; return false;"
                                               class="btn btn-dark"
                                               role="button" style="flex: 0 0 30%;">문서 목록으로 돌아가기</a>
                                            <button type="submit" class="btn btn-primary" style="flex: 0 0 50%;">변경내용 저장
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </form>
                    </div>
                </div>
            </div>
            <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->
        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; SOFTCORE 2026</span>
                </div>
            </div>
        </footer>
        <!-- End of Footer -->
    </div>
    <!-- End of Content Wrapper -->
</div>
<!-- End of Page Wrapper -->
<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>
<!-- Bootstrap core JavaScript-->
{% include '/common/commonScript.html' %}
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script>

    function displayFileInfo(input) {
        const file = input.files[0];
        const fileSizeElement = document.getElementById("fileSize");
        const previewElement = document.getElementById("imagePreview");
        if (file) {
            const sizeInMB = (file.size / (1024 * 1024)).toFixed(2); // MB로 변환
            fileSizeElement.textContent = `Selected file size: ${sizeInMB} MB`;
            // 이미지 미리보기
            const reader = new FileReader();
            reader.onload = function (e) {
                previewElement.src = e.target.result;
                previewElement.style.display = "block"; // 이미지 보이기
            };
            reader.readAsDataURL(file);
        } else {
            fileSizeElement.textContent = "";
            previewElement.style.display = "none"; // 이미지 숨기기
        }
    }
    const docContent = {{ (docs[5] | default('')) | tojson }};
    const quill = new Quill('#editor-container', {theme: 'snow'});
    quill.clipboard.dangerouslyPasteHTML(docContent);

    document.getElementById('editor-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        document.getElementById('dcontent').value = quill.root.innerHTML;
        const form = event.target;
        const formData = new FormData(form);
        const response = await fetch(form.action, {
            method: 'POST',
            body: formData
        });
        if (response.redirected) {
            window.location.href = response.url;
        } else {
            try {
                const result = await response.json();
                alert(result.message || "저장 실패");
            } catch {
                alert("알 수 없는 오류");
            }
        }
    });
</script>
</body>
</html>
