<!DOCTYPE html>
<html lang="en">
<head>
    {% include '/common/commHeader.html' %}
</head>
<body id="page-top">
<!-- Page Wrapper -->
<div id="wrapper">
    {% include '/common/sidebar.html' %}
    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            {% include '/common/topbar.html' %}
            <!-- Begin Page Content -->
            <div class="container-fluid">
                <!-- Page Heading & Form Card -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                        <h6 class="m-0 font-weight-bold text-primary">봉사실적 등록</h6>
                        <a href="/yk55servhist" class="btn btn-sm btn-secondary shadow-sm">
                            <i class="fas fa-arrow-left fa-sm text-white-50 mr-1"></i>목록으로 돌아가기
                        </a>
                    </div>
                    <div class="card-body">
                        <!-- 봉사실적 등록 폼 -->
                        <form id="serveHistForm" action="/save_servhist" method="POST">
                            <!-- 회기 및 봉사종류 -->
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="periodNo" class="font-weight-bold">회기 (대수)</label>
                                    <input type="number" class="form-control" id="periodNo" name="periodNo" placeholder="예: 55" required>
                                </div>
                                <div class="form-group col-md-6">
                                    <select class="form-control" id="serveType" name="serveType" required>
                                        <option value="DISTM" selected>지구행사 (DISTM)</option>
                                        <option value="REGIM">지역행사 (REGIM)</option>
                                        <option value="CLUBM">클럽행사 (CLUBM)</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 봉사명 -->
                            <div class="form-group">
                                <label for="serveTitle" class="font-weight-bold">봉사명 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="serveTitle" name="serveTitle" maxlength="1000" placeholder="봉사 사업명을 입력하세요" required>
                            </div>

                            <!-- 봉사 기간 및 봉사비용 -->
                            <div class="form-row">
                                <div class="form-group col-md-4">
                                    <label for="serveTimefrom" class="font-weight-bold">봉사 시작일</label>
                                    <input type="date" class="form-control" id="serveTimefrom" name="serveTimefrom">
                                </div>
                                <div class="form-group col-md-4">
                                    <label for="serveTimeto" class="font-weight-bold">봉사 종료일</label>
                                    <input type="date" class="form-control" id="serveTimeto" name="serveTimeto">
                                </div>
                                <div class="form-group col-md-4">
                                    <label for="serveCost" class="font-weight-bold">봉사비용 (원)</label>
                                    <input type="number" class="form-control" id="serveCost" name="serveCost" placeholder="예: 1500000" min="0">
                                </div>
                            </div>

                            <!-- 봉사내용 -->
                            <div class="form-group">
                                <label for="serveContent" class="font-weight-bold">봉사내용</label>
                                <textarea class="form-control" id="serveContent" name="serveContent" rows="6" maxlength="2000" placeholder="봉사 세부 내용을 입력하세요 (최대 2,000자)"></textarea>
                            </div>

                            <!-- 기본 설정값 (필요 시 노출 또는 hidden 유지) -->
                            <input type="hidden" name="attrib" value="1000010000">

                            <!-- 하단 버튼 영역 -->
                            <div class="text-right mt-4">
                                <a href="/yk55servhist" class="btn btn-secondary px-4 mr-2">취소</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="fas fa-save mr-1"></i>저장
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->
        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; SOFTCORE 2026</span>
                </div>
            </div>
        </footer>
        <!-- End of Footer -->
    </div>
    <!-- End of Content Wrapper -->
</div>
<!-- End of Page Wrapper -->
<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>
<!-- Bootstrap core JavaScript-->
{% include '/common/commonScript.html' %}

<!-- 유효성 검사 스크립트 -->
<script>
document.getElementById('serveHistForm').addEventListener('submit', function(e) {
    const startDate = document.getElementById('serveTimefrom').value;
    const endDate = document.getElementById('serveTimeto').value;

    if (startDate && endDate && startDate > endDate) {
        alert('봉사 종료일은 시작일보다 이전일 수 없습니다.');
        e.preventDefault();
    }
});
</script>

</body>
</html>
