<!DOCTYPE html>
<html lang="en">
<head>
    {% include '/common/commHeader.html' %}
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        #editor-container {
            height: 300px;
        }
    </style>
</head>
<body id="page-top">
<!-- Page Wrapper -->
<div id="wrapper">
    {% include '/common/sidebar.html' %}
    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            {% include '/common/topbar.html' %}
            <!-- Begin Page Content -->
            <div class="container-fluid">
                <!-- Page Heading -->
                <h1 class="h3 mb-4 text-gray-800">새문서 등록</h1>
                <div class="d-flex justify-content-center" style="min-height: 100vh;">
                    <div class="col-md-9">
                        <table class="table table-bordered text-center">
                            <thead>
                            </thead>
                            <tbody>
                            <form method="POST" id="editor-form" action="/yk55_greetings_insert">
                                <tr>
                                    <td> 제목 </td>
                                    <td> <input class="form-control" id="nottitle" name="nottitle" type="text" required ></td>
                                </tr>
                                <tr>
                                    <td> 내용 </td>
                                    <td><div id="editor-container" name = "notmessage"></div>
                                     <input type="hidden" name="notmessage" id="notmessage"></td>
                                </tr>
                                <tr>
                                    <td> 등록문서 </td>
                                    <td> <select class="form-control" id="docno">
                                        <option value="">선택</option>
                                    </select></td>
                                </tr>
                                <tr>
                                    <td> 등록종류</td>
                                    <td> <select class="form-control" id="nottype" name="nottype">
                                        <option value="RONLY" selected>축사</option>
                                        <option value="ATTYN">기념사</option>
                                        <option value="AGREE">회고사</option>
                                    </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td> 첨부 </td>
                                    <td></td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <div class="col-12"
                                             style="display: flex; justify-content: space-between; gap: 10px;">
                                            <a href="#" onclick="window.location.href='/yk55greet'; return false;"
                                               class="btn btn-dark"
                                               role="button" style="flex: 0 0 30%;">문서 목록으로 돌아가기</a>
                                            <button type="submit" class="btn btn-primary" style="flex: 0 0 50%;">신규문서로 저장
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </form>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->
        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; SOFTCORE 2026</span>
                </div>
            </div>
        </footer>
        <!-- End of Footer -->
    </div>
    <!-- End of Content Wrapper -->
</div>
<!-- End of Page Wrapper -->
<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>
<!-- Bootstrap core JavaScript-->
{% include '/common/commonScript.html' %}
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script>
    const quill = new Quill('#editor-container', { theme: 'snow' });

document.getElementById('editor-form').addEventListener('submit', async (event) => {
    event.preventDefault();

    // Quill 내용 input에 넣기
    document.getElementById('notmessage').value = quill.root.innerHTML;

    // 폼 데이터 수집
    const form = event.target;
    const formData = new FormData(form);

    // fetch로 전송
    const response = await fetch(form.action, {
        method: 'POST',
        body: formData
    });

    if (response.redirected) {
        window.location.href = response.url;
    } else {
        try {
            const result = await response.json();
            alert(result.message || "저장 실패");
        } catch {
            alert("알 수 없는 오류");
        }
    }
});
</script>
</body>
</html>
