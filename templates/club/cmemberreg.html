<!DOCTYPE html>
<html lang="en">
<head>
    {% include '/common/commHeader.html' %}

    <style>
  #popup-overlay{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(0,0,0,0.5);
    z-index: 999;
  }

  #popup{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%);
    z-index: 1000;

    /* 비율 기반 크기 */
    width: 50vw;     /* 가로 비율 */
    height: 50vh;    /* 세로 비율 */

    background:#fff;
    border:1px solid #ccc;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    box-sizing: border-box;
    overflow: hidden;
  }

  /* 닫기 버튼 영역을 고정 높이로 만들고 iframe 높이를 계산 */
  #popup-header{
    height: 44px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding: 6px 10px;
    border-bottom: 1px solid #eee;
    box-sizing: border-box;
    background: #fff;
  }

  #popup-close{
    background:#dc3545;
    color:#fff;
    border:none;
    padding:6px 10px;
    cursor:pointer;
  }

  #popup iframe{
    width:100%;
    height: calc(100% - 44px);
    border:0;
    display:block;
  }
</style>

    <style>
        #imagePreview {
            display: none; /* 기본적으로 숨김 */
            max-width: 200px; /* 최대 너비 설정 */
            max-height: 250px; /* 최대 높이 설정 */
            margin-top: 10px;
        }

        .image-container {
            display: flex; /* 이미지들을 가로로 배치 */
            justify-content: center; /* 가로 정렬 */
            align-items: center; /* 세로 정렬 */
            gap: 20px; /* 이미지 간격 */
        }
    </style>
</head>
<body id="page-top">
<!-- Page Wrapper -->
<div id="wrapper">
    {% include '/common/sidebar.html' %}
    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            {% include '/common/topbar.html' %}
            <!-- Begin Page Content -->
            <div class="container-fluid">
                <!-- Page Heading -->
                <h1 class="h3 mb-4 text-gray-800">클럽 신규 회원 등록</h1>
                <div class="d-flex justify-content-center" style="min-height: 100vh;">
                    <div class="col-md-9">
                        <form method="POST" id="editor-form" action="/cmember_insert">
                        <table class="table table-bordered text-center">
                            <thead>
                            </thead>
                            <tbody>
                                <tr>
                                    <td> 회원명 </td>
                                    <td><input class="form-control" id="membername" name="membername" type="text" required value=""></td>
                                </tr>
                                <tr>
                                    <td> 회원명(영문) </td>
                                    <td><input class="form-control" id="membernameeng" name="membernameeng" type="text" value=""></td>
                                </tr>
                                <tr>
                                    <td> 회원명(한문) </td>
                                    <td><input class="form-control" id="membernamecn" name="membernamecn" type="text" value=""></td>
                                </tr>
                                <tr>
                                    <td> 생년월일 </td>
                                    <td><input class="form-control" id="memberbirth" name="memberbirth" type="date" value=""></td>
                                </tr>
                                <tr>
                                    <td> 입회일 </td>
                                    <td><input class="form-control" id="regdate" name="regdate" type="date" value=""></td>
                                </tr>
                                <tr>
                                    <td> 회원번호 (국제) </td>
                                    <td><input class="form-control" id="regno" name="regno" type="number" value=""></td>
                                </tr>
                                <tr>
                                    <td> 성별 </td>
                                    <td><select class="form-control" id="membermf" name="membermf">
                                        <option value="M" selected>남성</option>
                                        <option value="F" >여성</option>
                                        </select>
                                        </td>
                                </tr>
                                <tr>
                                    <td> 소속클럽 </td>
                                    <td><select class="form-control selectpicker" data-live-search ="true" id="memberclub" name="memberclub">
                                        {% for sp in clubs %}
                                        <option value="{{ sp.clubNo }}" {% if session.user_Clubno == sp.clubNo %}selected {% endif %}>{{ sp.clubName }}</option>
                                        {% endfor %}
                                    </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td>활동상태</td>
                                    <td><select class="form-control" id="memberstat" name="memberstat">
                                        <option value="ACTIV" selected>활동중</option>
                                        <option value="RETIR" >퇴회</option>
                                        <option value="EXPEL" >제명</option>
                                        <option value="RIP" >사망</option>
                                        </select>
                                        </td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <div class="col-12"
                                             style="display: flex; justify-content: space-between; gap: 10px;">
                                            <a href="#" onclick="window.location.href='/club_memberlist/{{ session.user_Clubno }}'; return false;"
                                               class="btn btn-dark"
                                               role="button" style="flex: 0 0 30%;">클럽회원 목록으로 돌아가기</a>
                                            <button type="submit" class="btn btn-primary" style="flex: 0 0 50%;">신규회원등록
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        </form>
                    </div>
                </div>
            </div>
            <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->
        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; SOFTCORE 2026</span>
                </div>
            </div>
        </footer>
        <!-- End of Footer -->
    </div>
    <!-- End of Content Wrapper -->
</div>
<!-- End of Page Wrapper -->
<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>
<!-- Bootstrap core JavaScript-->
{% include '/common/commonScript.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">
<script>

    $(document).ready(function () {
    $('.selectpicker').selectpicker({
      style: 'btn-inverse',
      size: 20
     });
    });


</script>

</body>
</html>
