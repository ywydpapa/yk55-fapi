<!DOCTYPE html>
<html lang="en">
<head>
    {% include '/common/commHeader.html' %}

    <style>
        #popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        #popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;

            /* 비율 기반 크기 */
            width: 50vw; /* 가로 비율 */
            height: 50vh; /* 세로 비율 */

            background: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 닫기 버튼 영역을 고정 높이로 만들고 iframe 높이를 계산 */
        #popup-header {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 6px 10px;
            border-bottom: 1px solid #eee;
            box-sizing: border-box;
            background: #fff;
        }

        #popup-close {
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
        }

        #popup iframe {
            width: 100%;
            height: calc(100% - 44px);
            border: 0;
            display: block;
        }

        #imagePreview {
            display: none; /* 기본적으로 숨김 */
            max-width: 200px; /* 최대 너비 설정 */
            max-height: 250px; /* 최대 높이 설정 */
            margin-top: 10px;
        }

        .image-container {
            display: flex; /* 이미지들을 가로로 배치 */
            justify-content: center; /* 가로 정렬 */
            align-items: center; /* 세로 정렬 */
            gap: 20px; /* 이미지 간격 */
        }

        /* 한 줄(아이템) 높이를 고정해서 "5줄"이 정확히 보이게 */
        .ms-item {
            min-height: 44px; /* BS4 list-group-item 기본 높이 느낌 */
            display: flex;
            align-items: center;
        }

        /* 5줄만 보이게(5 * 44px = 220px) */
        .ms-list {
            max-height: 220px;
            overflow-y: auto;
        }

        /* 행 전체 클릭 시 커서 */
        .ms-item {
            cursor: pointer;
        }

        .ms-item {
            min-height: 44px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .ms-list {
            max-height: 220px;
            overflow-y: auto;
        }

        .ms-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: .5rem;
        }

        .ms-left {
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .ms-name {
            margin-left: .5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px; /* 필요시 조정 */
        }

        .ms-right {
            width: 140px; /* 후원금 입력칸 폭 */
            flex: 0 0 auto;
        }
    </style>
</head>
<body id="page-top">
<!-- Page Wrapper -->
<div id="wrapper">
    {% include '/common/sidebar.html' %}
    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            {% include '/common/topbar.html' %}
            <!-- Begin Page Content -->
            <div class="container-fluid">
                <!-- Page Heading -->
                <h1 class="h3 mb-4 text-gray-800">클럽 행사 보고</h1>
                <div class="d-flex justify-content-center" style="min-height: 100vh;">
                    <div class="col-md-9">
                        <table class="table table-bordered text-center">
                            <thead>
                            </thead>
                            <tbody>
                            <tr>
                                <td style="text-align: center; vertical-align: middle">행사 사진</td>
                                <td style="text-align: center">
                                    <div class="image-container">
                                        <img src="/static/img/event/ephoto_.png"
                                             onerror="this.src='/static/img/defaultphoto.png'" alt="Event Image">
                                        <img id="imagePreview" alt="Image Preview">
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>사진 변경</td>
                                <td>
                                    <form action="/uploadcephoto/" method="post" enctype="multipart/form-data">
                                        <input type="file" name="file" accept="image/*" required
                                               onchange="displayFileInfo(this)">
                                        <span id="fileSize"></span>
                                        <input type="submit" value="행사사진 Upload"></form>
                                </td>
                            </tr>
                            <form method="POST" id="editor-form" action="/insert_clubevent/">
                                <tr>
                                    <td> 행사명</td>
                                    <td>
                                        <div class="form-row">
                                            <div class="col-12 col-md-3 mb-2 mb-md-0">
                                                <label class="mb-1">회기</label>
                                                <select style="text-align: center" class="form-control" name="period"
                                                        id="periodSelect">
                                                    {% for pd in periodlist %}
                                                        {% if pd.periodNo==eventdtl[1] %}<option value="{{pd.periodNo}}">{{pd.periodTitle2}} 회기</option>{% endif %}
                                                    {% endfor %}
                                                </select>
                                            </div>
                                            <div class="col-12 col-md-9">
                                                <label class="mb-1">행사명</label>
                                                <select class="form-control" name="event" id="eventSelect" required>
                                                    <option value="{{eventdtl[0]}}"> {{eventdtl[2]}} </option>
                                                </select>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td> 참석자</td>
                                    <td>
                                        <div class="border rounded">
                                            <!-- 헤더(고정) -->
                                            <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
                                                <div class="custom-control custom-checkbox mb-0">
                                                    <input type="checkbox" class="custom-control-input" id="checkAll">
                                                    <label class="custom-control-label" for="checkAll">전체 선택</label>
                                                </div>

                                                <div class="d-flex align-items-center">
                                                    <small class="text-muted mr-2"><span id="selectedCount">0</span>명 선택</small>

                                                    <!-- 상태 필터 -->
                                                    <select id="statusFilter" class="custom-select custom-select-sm"
                                                            style="width: 140px;">
                                                        <option value="ALL">전체</option>
                                                        <option value="ACTIV" selected>활동중</option>
                                                        <option value="RETIR">퇴회</option>
                                                        <option value="EXPEL">제명</option>
                                                        <option value="RIP">사망</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <!-- 리스트(스크롤) -->
                                            <div class="list-group list-group-flush ms-list" id="memberListBox">
                                                {% for mem in memberlist %}
                                                <div class="list-group-item mb-0 ms-item"
                                                     data-status="{{ mem.memberStatus }}">
                                                    <div class="ms-row">
                                                        <!-- 왼쪽: 체크 + 이름 -->
                                                        <div class="ms-left">
                                                            <div class="custom-control custom-checkbox mb-0">
                                                                <input type="checkbox"
                                                                       class="custom-control-input item-check"
                                                                       id="item{{ mem.memberNo }}"
                                                                       name="memberNo"
                                                                       value="{{ mem.memberNo }}">
                                                                <label class="custom-control-label"
                                                                       for="item{{ mem.memberNo }}">
                                                                    <span class="ms-name">{{ mem.memberName }}</span>
                                                                </label>
                                                            </div>
                                                        </div>
                                                        <!-- 오른쪽: 후원금 -->
                                                        <div class="ms-right">
                                                            <input type="text"
                                                                   class="form-control form-control-sm text-right support-amt"
                                                                   id="spt{{ mem.memberNo }}"
                                                                   name="supportAmount[{{ mem.memberNo }}]"
                                                                   value=""
                                                                   inputmode="numeric"
                                                                   placeholder="후원금">
                                                        </div>
                                                    </div>
                                                </div>
                                                {% endfor %}
                                            </div>
                                        </div>

                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        비용
                                    </td>
                                    <td>
                                        <input type="currency" style="text-align: right" class="form-control"
                                               name="cost" value="0" required>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <div class="col-12"
                                             style="display: flex; justify-content: space-between; gap: 10px;">
                                            <a href="#"
                                               onclick="window.location.href='/report_eventlist/{{session.user_Clubno}}'; return false;"
                                               class="btn btn-dark"
                                               role="button" style="flex: 0 0 30%;">봉사 목록으로 돌아가기</a>
                                            <button type="submit" class="btn btn-primary" style="flex: 0 0 50%;">변경내용저장
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </form>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->
        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; SOFTCORE 2026</span>
                </div>
            </div>
        </footer>
        <!-- End of Footer -->
    </div>
    <!-- End of Content Wrapper -->
</div>
<!-- End of Page Wrapper -->
<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>
<!-- Bootstrap core JavaScript-->
{% include '/common/commonScript.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">
<script>

    $(document).ready(function () {
        $('.selectpicker').selectpicker({
            style: 'btn-inverse',
            size: 20
        });
    });

    function displayFileInfo(input) {
        const file = input.files[0];
        const fileSizeElement = document.getElementById("fileSize");
        const previewElement = document.getElementById("imagePreview");
        if (file) {
            const sizeInMB = (file.size / (1024 * 1024)).toFixed(2); // MB로 변환
            fileSizeElement.textContent = `Selected file size: ${sizeInMB} MB`;
            // 이미지 미리보기
            const reader = new FileReader();
            reader.onload = function (e) {
                previewElement.src = e.target.result;
                previewElement.style.display = "block"; // 이미지 보이기
            };
            reader.readAsDataURL(file);
        } else {
            fileSizeElement.textContent = "";
            previewElement.style.display = "none"; // 이미지 숨기기
        }
    }

    (function () {
        var checkAll = document.getElementById('checkAll');
        var selectedCount = document.getElementById('selectedCount');
        var statusFilter = document.getElementById('statusFilter');
        var listBox = document.getElementById('memberListBox');

        function getItems() {
            return Array.prototype.slice.call(listBox.querySelectorAll('.ms-item'));
        }

        function getChecks() {
            return Array.prototype.slice.call(listBox.querySelectorAll('.item-check'));
        }

        function isVisibleItem(labelEl) {
            return labelEl.style.display !== 'none';
        }

        function applyFilter() {
            var v = statusFilter.value; // ALL or 상태명
            getItems().forEach(function (labelEl) {
                var st = (labelEl.getAttribute('data-status') || '').trim();
                var show = (v === 'ALL') || (st === v);
                labelEl.style.display = show ? '' : 'none';
            });

            // 필터 바뀌면 전체선택/카운트도 갱신
            refresh();
        }

        function refresh() {
            var items = getItems();
            var checks = getChecks();

            // 선택 개수는 "전체(숨김 포함)" 기준으로 유지
            var checkedTotal = checks.filter(function (x) {
                return x.checked;
            }).length;
            selectedCount.textContent = checkedTotal;

            // 전체선택은 "현재 보이는 항목"만 기준으로 동작/표시
            var visibleChecks = items
                .filter(isVisibleItem)
                .map(function (labelEl) {
                    return labelEl.querySelector('.item-check');
                })
                .filter(function (x) {
                    return x && !x.disabled;
                });

            var visibleChecked = visibleChecks.filter(function (x) {
                return x.checked;
            }).length;

            checkAll.checked = visibleChecks.length > 0 && visibleChecked === visibleChecks.length;
            checkAll.indeterminate = visibleChecked > 0 && visibleChecked < visibleChecks.length;
        }

        checkAll.addEventListener('change', function () {
            // 보이는 항목만 전체선택/해제
            getItems().forEach(function (labelEl) {
                if (!isVisibleItem(labelEl)) return;
                var cb = labelEl.querySelector('.item-check');
                if (cb && !cb.disabled) cb.checked = checkAll.checked;
            });
            refresh();
        });

        listBox.addEventListener('change', function (e) {
            if (e.target && e.target.classList.contains('item-check')) refresh();
        });

        statusFilter.addEventListener('change', applyFilter);

        // 초기화
        applyFilter();
    })();

    (function () {
        var form = document.getElementById('editor-form');
        var listBox = document.getElementById('memberListBox');

        function hasAnyChecked() {
            return !!listBox.querySelector('.item-check:checked');
        }

        form.addEventListener('submit', function (e) {
            if (!hasAnyChecked()) {
                e.preventDefault();
                alert('참석자를 1명 이상 선택해 주세요.');
                return false;
            }
        });
    })();

  (function () {
    var form = document.getElementById('editor-form');
    var listBox = document.getElementById('memberListBox');

    function normalizeAmt(s) {
      s = (s || '').toString().trim();
      // 콤마/공백 제거 후 숫자만
      s = s.replace(/,/g, '').replace(/\s+/g, '');
      if (s === '') return '0';
      // 숫자 이외 제거(원하면 더 엄격히 가능)
      s = s.replace(/[^\d]/g, '');
      return s === '' ? '0' : s;
    }

    function syncAmtEnabled() {
      var rows = Array.prototype.slice.call(listBox.querySelectorAll('.ms-item'));
      rows.forEach(function (row) {
        var cb = row.querySelector('.item-check');
        var amt = row.querySelector('.support-amt');
        if (!cb || !amt) return;

        if (cb.checked) {
          amt.disabled = false;
          // 빈 값이면 0
          amt.value = normalizeAmt(amt.value);
        } else {
          amt.disabled = true;
          amt.value = ''; // 미선택은 아예 미전송
        }
      });
    }

    // 초기 상태
    syncAmtEnabled();

    // 개별 체크 변경 시
    listBox.addEventListener('change', function (e) {
      if (e.target && e.target.classList.contains('item-check')) {
        syncAmtEnabled();
      }
    });

    // 전체선택 버튼을 누른 뒤에도 반영되도록(기존 코드에 의해 체크가 바뀐 후)
    document.getElementById('checkAll').addEventListener('change', function () {
      setTimeout(syncAmtEnabled, 0);
    });

    // submit 검증 + 금액 정리
    form.addEventListener('submit', function (e) {
      var anyChecked = !!listBox.querySelector('.item-check:checked');
      if (!anyChecked) {
        e.preventDefault();
        alert('참석자를 1명 이상 선택해 주세요.');
        return false;
      }

      // 체크된 사람 금액 정리(콤마 제거 등)
      var checkedRows = Array.prototype.slice.call(listBox.querySelectorAll('.ms-item'))
        .filter(function (row) {
          var cb = row.querySelector('.item-check');
          return cb && cb.checked;
        });

      checkedRows.forEach(function (row) {
        var amt = row.querySelector('.support-amt');
        if (amt) amt.value = normalizeAmt(amt.value);
      });
    });
  })();
</script>


</body>
</html>
